# Evaluates this flake on every push and pull request.
#
# What this catches: anything that fails evaluation. Syntax errors, missing
# files or template paths, broken module options, and -- the reason it earns
# its keep -- the assertions in modules/core/assertions.nix.
#
# What this does NOT catch: anything that only shows up at runtime. A config
# can evaluate, build, activate and still fail to boot; that is exactly how
# this machine reached emergency mode on 2026-09-22. Evaluation checks are a
# floor, not a guarantee. See modules/core/assertions.nix.
#
# Do NOT add --no-build. modules/programs/cli/lazygit/default.nix uses
# import-from-derivation: it builds a yaml-to-json derivation *during*
# evaluation and reads the result. --no-build forbids that build, so
# evaluation dies with
#
#   error: path '...-lazygit-yaml-to-attribute-set.drv' is not valid
#
# This passes locally regardless, because that output is already in the local
# store -- it only fails on a cold machine, which is precisely what CI is.
name: nix flake check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fails the run on any evaluation error, and on any assertion in
      # modules/core/assertions.nix.
      - name: nix flake check
        run: nix flake check --show-trace
